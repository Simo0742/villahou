name: Opdater Airbnb kalender
on:
  schedule:
    # Ændret fra '0 * * * *' til et skævt minut for at undgå Airbnbs myldretid/blokering
    - cron: '27 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Hent Airbnb iCal og gem som JSON
        run: |
          # Tilføjet --retry og --max-time for at håndtere små udfald i netværket
          curl -sS --retry 3 --max-time 15 "https://www.airbnb.dk/calendar/ical/1440420483011438215.ics?t=50358892574146fbb10083c54419f796" -o calendar.ics

          python3 << 'PYEOF'
          import re, json, sys
          from datetime import datetime, timezone

          try:
              with open('calendar.ics', 'r', encoding='utf-8', errors='ignore') as f:
                  text = f.read()
          except FileNotFoundError:
              print("Fejl: calendar.ics blev ikke oprettet korrekt.")
              sys.exit(1)

          # Sikkerhedstjek: Hvis vi modtog en fejlside i stedet for en rigtig kalender,
          # afbryder vi med en fejl i stedet for at overskrive hjemmesiden med en tom kalender.
          if "BEGIN:VCALENDAR" not in text:
              print("Fejl: Modtog ikke gyldig iCal data fra Airbnb. Afbryder for at beskytte eksisterende data.")
              sys.exit(1)

          ranges = []
          events = text.split('BEGIN:VEVENT')
          for ev in events[1:]:
              s = re.search(r'DTSTART[^:\n]*:([^\r\n]+)', ev)
              e = re.search(r'DTEND[^:\n]*:([^\r\n]+)', ev)
              if s and e:
                  try:
                      ds = re.sub(r'[^\d]', '', s.group(1).strip())[:8]
                      de = re.sub(r'[^\d]', '', e.group(1).strip())[:8]
                      if len(ds) == 8 and len(de) == 8:
                          ranges.append({'from': ds, 'to': de})
                  except:
                      pass

          out = {
              'updated': datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ'),
              'booked': ranges
          }
          with open('calendar.json', 'w') as f:
              json.dump(out, f)
          print(f"Gemt {len(ranges)} bookinger")
          PYEOF
      - name: Commit og push calendar.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add calendar.json
          # Sikrer at vi kun pusher, hvis der rent faktisk er ændringer i kalenderen
          git diff --staged --quiet || (git commit -m "Opdater kalender $(date -u '+%Y-%m-%d %H:%M UTC')" && git push)
      - name: Deploy til GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Publish Pages
        uses: actions/deploy-pages@v4
